name: Security Scan

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: 'Scan ID from Supabase'
        required: true
      target_url:
        description: 'Target URL to scan'
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # إضافة: Node.js + Puppeteer لدعم مواقع SPA (React/Angular/Vue) - إصلاح 6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: |
          npm install puppeteer --prefix "$HOME/puppeteer-env" --silent 2>/dev/null || true
          mkdir -p backend/github_actions/node_modules
          cp -r "$HOME/puppeteer-env/node_modules" backend/github_actions/ 2>/dev/null || true
        continue-on-error: true

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nmap whatweb nikto jq dnsutils whois openssl
          sudo apt-get install -y -qq gobuster ffuf dirsearch wfuzz sqlmap wapiti
          sudo apt-get install -y -qq skipfish dnsrecon fierce hydra commix
        continue-on-error: true

      - name: Install Python tools
        run: |
          pip install --quiet wafw00f
          pip install --quiet supabase httpx requests
          pip install --quiet sslyze
          pip install --quiet theHarvester
        continue-on-error: true

      - name: Install ProjectDiscovery tools
        run: |
          mkdir -p $HOME/tools
          cd $HOME/tools
          wget -q https://github.com/projectdiscovery/subfinder/releases/download/v2.6.6/subfinder_2.6.6_linux_amd64.zip || true
          unzip -q subfinder_2.6.6_linux_amd64.zip 2>/dev/null || true
          sudo mv subfinder /usr/local/bin/ 2>/dev/null || true
          wget -q https://github.com/projectdiscovery/nuclei/releases/download/v3.3.5/nuclei_3.3.5_linux_amd64.zip || true
          unzip -q nuclei_3.3.5_linux_amd64.zip 2>/dev/null || true
          sudo mv nuclei /usr/local/bin/ 2>/dev/null || true
          wget -q https://github.com/projectdiscovery/httpx/releases/download/v1.6.9/httpx_1.6.9_linux_amd64.zip || true
          unzip -q httpx_1.6.9_linux_amd64.zip 2>/dev/null || true
          sudo mv httpx /usr/local/bin/ 2>/dev/null || true
          wget -q https://github.com/projectdiscovery/katana/releases/download/v1.1.2/katana_1.1.2_linux_amd64.zip || true
          unzip -q katana_1.1.2_linux_amd64.zip 2>/dev/null || true
          sudo mv katana /usr/local/bin/ 2>/dev/null || true
          wget -q https://github.com/projectdiscovery/naabu/releases/download/v2.3.1/naabu_2.3.1_linux_amd64.zip || true
          unzip -q naabu_2.3.1_linux_amd64.zip 2>/dev/null || true
          sudo mv naabu /usr/local/bin/ 2>/dev/null || true
          wget -q https://github.com/projectdiscovery/dnsx/releases/download/v1.2.1/dnsx_1.2.1_linux_amd64.zip || true
          unzip -q dnsx_1.2.1_linux_amd64.zip 2>/dev/null || true
          sudo mv dnsx /usr/local/bin/ 2>/dev/null || true
          wget -q https://github.com/projectdiscovery/tlsx/releases/download/v1.1.6/tlsx_1.1.6_linux_amd64.zip || true
          unzip -q tlsx_1.1.6_linux_amd64.zip 2>/dev/null || true
          sudo mv tlsx /usr/local/bin/ 2>/dev/null || true
        continue-on-error: true

      - name: Install Dalfox and Retire.js
        run: |
          wget -q https://github.com/hahwul/dalfox/releases/download/v2.9.2/dalfox_2.9.2_linux_amd64.tar.gz || true
          tar -xzf dalfox_2.9.2_linux_amd64.tar.gz 2>/dev/null || true
          sudo mv dalfox /usr/local/bin/ 2>/dev/null || true
          sudo npm install -g retire 2>/dev/null || true
        continue-on-error: true

      - name: Install GAU
        run: |
          wget -q https://github.com/lc/gau/releases/download/v2.2.3/gau_2.2.3_linux_amd64.tar.gz || true
          tar -xzf gau_2.2.3_linux_amd64.tar.gz 2>/dev/null || true
          sudo mv gau /usr/local/bin/ 2>/dev/null || true
        continue-on-error: true

      - name: Install Waybackurls
        run: |
          wget -q https://github.com/tomnomnom/waybackurls/releases/download/v0.1.0/waybackurls-linux-amd64-0.1.0.tgz || true
          tar -xzf waybackurls-linux-amd64-0.1.0.tgz 2>/dev/null || true
          sudo mv waybackurls /usr/local/bin/ 2>/dev/null || true
        continue-on-error: true

      - name: Install XSStrike
        run: |
          git clone --quiet --depth=1 https://github.com/s0md3v/XSStrike.git /opt/XSStrike 2>/dev/null || true
          pip install --quiet -r /opt/XSStrike/requirements.txt 2>/dev/null || true
        continue-on-error: true

      - name: Install SpiderFoot
        run: |
          git clone --quiet --depth=1 https://github.com/smicallef/spiderfoot.git /opt/spiderfoot 2>/dev/null || true
          cd /opt/spiderfoot && pip install --quiet -r requirements.txt 2>/dev/null || true
        continue-on-error: true

      - name: Verify tools
        run: |
          echo "=== Tool Verification ==="
          for tool in nmap whatweb nikto subfinder nuclei httpx katana naabu dnsx tlsx gobuster ffuf dirsearch wfuzz sqlmap wapiti dalfox gau waybackurls wafw00f theHarvester sslyze node; do
            if command -v $tool >/dev/null 2>&1; then
              echo "OK: $tool"
            else
              echo "MISSING: $tool"
            fi
          done
          if [ -d "backend/github_actions/node_modules/puppeteer" ]; then
            echo "OK: puppeteer"
          else
            echo "MISSING: puppeteer (سيتم تخطي فحص SPA)"
          fi

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCAN_ID: ${{ inputs.scan_id }}
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          python backend/github_actions/scanner.py
        continue-on-error: true